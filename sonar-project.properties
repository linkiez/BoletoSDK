# SonarQube Community Edition Project Configuration
sonar.projectKey=BoletoSDK

# Project metadata
sonar.projectName=BoletoSDK
sonar.projectVersion=1.0

# Server configuration (default: http://localhost:9000)
sonar.host.url=http://192.168.0.6:9000

# Source code configuration
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts

# Test and coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts

# TypeScript specific
sonar.typescript.tsconfigPath=tsconfig.json
